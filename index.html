/* =========================================================================
   1. BASE STYLES & PRO TRADING DARK THEME (HIGH PERFORMANCE)
   ========================================================================= */
:root {
  --bg-main: #0b0e14;
  --bg-card: #141822;
  --bg-panel: #1a202c;
  --bg-input: #0f131d;
  
  --border: rgba(255, 255, 255, 0.08);
  --border-active: #2962ff;

  --text-main: #f1f5f9;
  --text-muted: #848e9c;
  --text-dim: #475569;

  --green: #0ecb81;
  --green-bg: rgba(14, 203, 129, 0.12);
  --red: #f6465d;
  --red-bg: rgba(246, 70, 93, 0.12);
  --blue: #2962ff;
  --blue-bg: rgba(41, 98, 255, 0.15);
  --gold: #f0b90b;
  --gold-bg: rgba(240, 185, 11, 0.15);

  --nav-h: 62px;
  --header-h: 56px;
  --radius: 14px;
  --radius-sm: 8px;
}

* {
  margin: 0; padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

html, body {
  width: 100%; height: 100%;
  height: 100dvh;
  overflow: hidden;
  font-family: 'Inter', -apple-system, sans-serif;
  background-color: var(--bg-main);
  color: var(--text-main);
  line-height: 1.35;
  -webkit-font-smoothing: antialiased;
}

.mono { font-family: 'JetBrains Mono', monospace; }
.hidden { display: none !important; }

/* Smooth Scrollbars */
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

/* Smooth Hardware-Accelerated Transitions */
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
@keyframes pulseGlow { 0% { box-shadow: 0 0 0 0 rgba(41, 98, 255, 0.4); } 70% { box-shadow: 0 0 0 8px rgba(41, 98, 255, 0); } 100% { box-shadow: 0 0 0 0 rgba(41, 98, 255, 0); } }

.svg-icon {
  width: 18px; height: 18px;
  stroke: currentColor; fill: none;
  stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
  display: inline-block; vertical-align: middle;
}

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 10px 16px; border-radius: var(--radius-sm); font-size: 13.5px; font-weight: 700;
  background: var(--bg-panel); border: 1px solid var(--border); color: var(--text-main);
  cursor: pointer; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  will-change: transform, opacity;
  white-space: nowrap; outline: none;
}
.btn:active { transform: scale(0.96); opacity: 0.85; }
.btn.primary { background: var(--blue); border: none; color: #fff; box-shadow: 0 4px 16px rgba(41,98,255,0.35); }
.btn.buy { background: var(--green); border: none; color: #000; font-weight: 800; box-shadow: 0 4px 16px rgba(14,203,129,0.3); }
.btn.sell { background: var(--red); border: none; color: #fff; font-weight: 800; box-shadow: 0 4px 16px rgba(246,70,93,0.3); }
.btn.gold { background: var(--gold); border: none; color: #000; font-weight: 800; box-shadow: 0 4px 16px rgba(240,185,11,0.3); }
.btn.sm { padding: 6px 10px; font-size: 12px; }
.btn.full { width: 100%; }
.btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none !important; box-shadow: none !important; }

.inp {
  width: 100%; padding: 10px 12px; border-radius: var(--radius-sm);
  background: var(--bg-input); border: 1px solid var(--border);
  color: var(--text-main); font-size: 14px; font-weight: 600; outline: none;
  transition: border-color 0.2s ease, box-shadow 0.2s ease;
}
.inp:focus { border-color: var(--blue); box-shadow: 0 0 0 2px rgba(41,98,255,0.2); }

.field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
.field label { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }

/* Layout & Screens */
.auth-wrapper {
  position: fixed; inset: 0; z-index: 999;
  display: grid; place-items: center; padding: 18px;

}
.auth-card {
  width: 100%; max-width: 380px; padding: 24px; border-radius: 16px;

.brand-icon {

.err-msg { color: var(--red); font-size: 12px; font-weight: 600; min-height: 16px; margin-top: 8px; }

.app-layout { display: flex; flex-direction: column; width: 100vw; height: 100dvh; overflow: hidden; }

.header {

.user-pill { display: flex; align-items: center; gap: 10px; }

.cash-display { font-size: 14px; font-weight: 800; color: var(--green); }

.content-area { flex: 1; height: calc(100dvh - var(--header-h) - var(--nav-h)); overflow-y: auto; position: relative; }

.bottom-nav {

  background: var(--bg-card); border-top: 1px solid var(--border); z-index: 100;

.nav-item {

.card-panel { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.2); }

.ticker-card {

.ticker-card .val { font-size: 12.5px; font-weight: 800; margin-top: 2px; }

.coin-row {

.coin-row:hover, .coin-row:active { background: rgba(41, 98, 255, 0.08); }
.coin-left { display: flex; align-items: center; gap: 10px; }
.coin-icon { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 12px; color: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
.coin-symbol { font-weight: 800; font-size: 14px; }
.coin-name { font-size: 11px; color: var(--text-muted); }

.coin-chg.up { color: var(--green); background: var(--green-bg); }
.coin-chg.down { color: var(--red); background: var(--red-bg); }

/* Pro Terminal & Order Book */
.terminal-screen { display: flex; flex-direction: column; height: 100%; }
.terminal-bar { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; background: var(--bg-main); border-bottom: 1px solid var(--border); }
.tf-selector { display: flex; gap: 4px; }
.tf-btn { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: 700; color: var(--text-muted); background: transparent; border: none; cursor: pointer; transition: 0.15s; }

.terminal-main-layout { display: flex; flex: 1; overflow: hidden; }
.chart-box { flex: 1; position: relative; width: 100%; min-height: 180px; background: var(--bg-main); }
.chart-box canvas { position: absolute; inset: 0; width: 100%; height: 100%; }

.trade-panel-bottom { background: var(--bg-card); border-top: 1px solid var(--border); padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.order-type-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.pct-btns { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }

/* Shop & Profile components */
.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.stat-item { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
.stat-item label { font-size: 10.5px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }

.shop-tabs { display: flex; gap: 6px; margin-bottom: 12px; overflow-x: auto; padding-bottom: 2px; }
.shop-tab { padding: 6px 12px; border-radius: var(--radius-sm); font-size: 12px; font-weight: 700; background: var(--bg-panel); border: 1px solid var(--border); color: var(--text-muted); cursor: pointer; white-space: nowrap; transition: all 0.2s ease; }
.shop-tab.active { background: var(--blue-bg); border-color: var(--blue); color: var(--text-main); }

.shop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.shop-card { background: var(--bg-panel); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px; text-align: center; display: flex; flex-direction: column; justify-content: space-between; gap: 8px; transition: transform 0.2s ease; }
.shop-card:hover { transform: translateY(-2px); }

/* Avatars */
.av-box { position: relative; width: 40px; height: 40px; border-radius: 50%; display: inline-grid; place-items: center; flex-shrink: 0; }
.av-ring { position: absolute; inset: -2px; border-radius: 50%; z-index: 1; }
.av-inner { width: 100%; height: 100%; border-radius: 50%; overflow: hidden; background: var(--bg-panel); display: grid; place-items: center; z-index: 2; font-weight: 800; font-size: 13px; }
.av-inner img { width: 100%; height: 100%; object-fit: cover; }

/* Modal & Toast */
#toast-container { position: fixed; top: 12px; left: 14px; right: 14px; z-index: 1000; pointer-events: none; display: flex; flex-direction: column; gap: 6px; }
.toast { padding: 10px 14px; border-radius: var(--radius-sm); font-size: 12.5px; font-weight: 700; background: var(--bg-panel); border: 1px solid var(--border); color: var(--text-main); box-shadow: 0 10px 30px rgba(0,0,0,0.5); animation: fadeIn 0.2s cubic-bezier(0.16, 1, 0.3, 1); display: flex; align-items: center; gap: 8px; will-change: transform, opacity; }
.toast.ok { border-color: var(--green); color: var(--green); }
.toast.err { border-color: var(--red); color: var(--red); }
</style>

<script>
class SoundFx {
  constructor() { this.ctx = null; this.enabled = true; }
  init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }
  play(type) {
    if (!this.enabled) return;
    this.init();
    if (!this.ctx) return;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.connect(gain); gain.connect(this.ctx.destination);
    const now = this.ctx.currentTime;

    if (type === 'buy') {
      osc.frequency.setValueAtTime(440, now);
      osc.frequency.exponentialRampToValueAtTime(880, now + 0.12);
      gain.gain.setValueAtTime(0.15, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.12);
      osc.start(now); osc.stop(now + 0.12);
    } else if (type === 'sell') {
      osc.frequency.setValueAtTime(600, now);
      osc.frequency.exponentialRampToValueAtTime(300, now + 0.12);
      gain.gain.setValueAtTime(0.15, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.12);
      osc.start(now); osc.stop(now + 0.12);
    } else if (type === 'click') {
      osc.frequency.setValueAtTime(800, now);
      gain.gain.setValueAtTime(0.05, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.04);
      osc.start(now); osc.stop(now + 0.04);
    }
  }
}

    u.level++;

/* Smooth Canvas Chart Scroller */
function drawChart() {
  const canvas = document.getElementById('chart-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const parent = canvas.parentElement;

  const w = canvas.width = parent.clientWidth;
  const h = canvas.height = parent.clientHeight;
  ctx.clearRect(0, 0, w, h);

  const hist = marketHistory[activeSym];
  if (!hist || hist.length === 0) return;

  const livePrice = ASSETS[activeSym].price;
  const chartData = [...hist];
  chartData[chartData.length - 1] = livePrice;

  const color = ASSETS[activeSym].color;
  const min = Math.min(...chartData);
  const max = Math.max(...chartData);
  const range = (max - min) || 1;

  ctx.strokeStyle = 'rgba(255,255,255,0.03)';
  ctx.lineWidth = 1;
  for (let i = 1; i < 5; i++) {
    const y = (h / 5) * i;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
  }

  const pts = chartData.map((v, i) => ({
    x: (i / (chartData.length - 1)) * w,
    y: h - ((v - min) / range) * (h - 32) - 16
  }));

  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length; i++) {
    const xc = (pts[i].x + pts[i - 1].x) / 2;
    const yc = (pts[i].y + pts[i - 1].y) / 2;
    ctx.quadraticCurveTo(pts[i - 1].x, pts[i - 1].y, xc, yc);
  }
  ctx.strokeStyle = color;
  ctx.lineWidth = 2.5;
  ctx.stroke();

  const grad = ctx.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0, color + '35');
  grad.addColorStop(1, color + '00');
  ctx.lineTo(w, h); ctx.lineTo(0, h); ctx.closePath();
  ctx.fillStyle = grad;
  ctx.fill();

  const last = pts[pts.length - 1];
  ctx.beginPath();
  ctx.arc(last.x, last.y, 5, 0, Math.PI * 2);
  ctx.fillStyle = color;
  ctx.fill();
  ctx.lineWidth = 2;
  ctx.strokeStyle = '#fff';
  ctx.stroke();
}

/* Auth Logic */
function setAuthTab(mode) {
  authMode = mode;
  document.getElementById('tab-login').classList.toggle('active', mode === 'login');
  document.getElementById('tab-reg').classList.toggle('active', mode === 'register');
  document.getElementById('reg-box').classList.toggle('hidden', mode === 'login');
  document.getElementById('auth-btn').textContent = mode === 'login' ? 'Войти' : 'Зарегистрироваться';
  document.getElementById('auth-err').textContent = '';
  if (mode === 'register') initCaptcha();
}

function initCaptcha() {
  const canvas = document.getElementById('captcha-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  captchaCode = Math.random().toString(36).substring(2, 7).toUpperCase();
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, 140, 38);
  ctx.font = 'bold 20px "JetBrains Mono"'; ctx.fillStyle = '#2962ff';
  ctx.fillText(captchaCode, 25, 26);
}

function handleAuth(e) {
  e.preventDefault();
  const login = document.getElementById('auth-login').value.trim();
  const pass = document.getElementById('auth-pass').value;

  if (authMode === 'register') {
    const pass2 = document.getElementById('auth-pass2').value;
    const captcha = document.getElementById('auth-captcha').value.toUpperCase();
    if (pass !== pass2) return showErr('Пароли не совпадают!');
    if (captcha !== captchaCode) return showErr('Неверная капча!');
    if (DB.users[login]) return showErr('Пользователь уже существует!');

    DB.users[login] = { 
      login, pass, cash: 10000, level: 1, xp: 0, 
      frame: 'fr_base', nickColor: 'nk_base', prefix: 'pref_none',
      inventory: { frames: ['fr_base'], nicks: ['nk_base'], prefixes: ['pref_none'] },
      customAvatar: null, portfolio: {}, buyPrices: {} 
    };
    toast('Регистрация успешна!', 'ok');
  } else {
    if (!DB.users[login] || DB.users[login].pass !== pass) return showErr('Неверный логин или пароль!');
  }

  DB.session = login;
  saveDB();
  startApp();
}

function showErr(msg) { document.getElementById('auth-err').textContent = msg; }

function startApp() {
  document.getElementById('auth-screen').classList.add('hidden');
  document.getElementById('app-screen').classList.remove('hidden');
  renderHeader();
  switchNav('market');
}

  sounds.play('click');

  const availUSD = u.cash * pct;

function doTrade(type) {
  const u = getUser();
  const price = ASSETS[activeSym].price;
  const inp = document.getElementById('trade-qty');
  const qty = parseFloat(inp.value) || 0;

  if (qty <= 0) {
    toast('Введите количество!', 'err');
    return;
  }

  const cost = qty * price;

  if (type === 'buy') {
    if (u.cash < cost) {
      toast('Недостаточно средств!', 'err');
      return;
    }
    const currQty = u.portfolio[activeSym] || 0;
    const currAvg = u.buyPrices[activeSym] || price;
    const newQty = currQty + qty;
    const newAvg = ((currQty * currAvg) + cost) / newQty;

    u.cash -= cost;
    u.portfolio[activeSym] = newQty;
    u.buyPrices[activeSym] = newAvg;
    addXP(u, Math.max(5, Math.floor(cost / 40)));
    sounds.play('buy');
  } else {
    const currQty = u.portfolio[activeSym] || 0;
    if (currQty < qty) {
      toast('Недостаточно монет для продажи!', 'err');
      return;
    }
    u.cash += cost;
    u.portfolio[activeSym] = currQty - qty;
    if (u.portfolio[activeSym] <= 0.0001) {
      delete u.portfolio[activeSym];
      delete u.buyPrices[activeSym];
    }
    addXP(u, Math.max(5, Math.floor(cost / 40)));
    sounds.play('sell');
  }

  saveDB();
  toast('Сделка проведена!', 'ok');
  renderTradeView(document.getElementById('main-view'), u);
  renderHeader();
}

  container.className = 'content-area page padding-box';
  const prefObj = SHOP.prefixes.find(p => p.id === u.prefix) || SHOP.prefixes[0];
  const nickObj = SHOP.nicks.find(n => n.id === u.nickColor) || SHOP.nicks[0];
  const nextXP = getReqXP(u.level);
  const xpPct = Math.min(100, Math.floor((u.xp / nextXP) * 100));

  container.innerHTML = `
    <div style="display:flex; align-items:center; gap:14px; margin-bottom:16px;">
      <div onclick="document.getElementById('avatar-input').click()" style="cursor:pointer;" title="Сменить аватар">
        ${renderAvatarHTML(u, 54)}
      </div>
      <div style="flex:1;">
        <div style="display:flex; align-items:center; gap:8px;">
          <h3 style="font-weight:900; font-size:18px;">
            ${prefObj.label ? `<span style="font-size:11px; padding:2px 6px; border-radius:4px; background:var(--blue-bg); color:var(--blue); border:1px solid rgba(41,98,255,0.3); margin-right:4px;">${prefObj.label}</span>` : ''}
            <span style="color:${nickObj.color}">${u.login}</span>
          </h3>
        </div>
        <div style="font-size:11.5px; color:var(--text-muted); margin-top:2px;">Уровень ${u.level} (${u.xp} / ${nextXP} XP)</div>
        <div style="width:100%; height:4px; background:var(--bg-input); border-radius:4px; margin-top:6px; overflow:hidden;">
          <div style="width:${xpPct}%; height:100%; background:var(--blue); border-radius:4px; transition:width 0.3s ease;"></div>
        </div>
      </div>
    </div>

    <div class="card-panel">
      <h4 style="font-weight:800; margin-bottom:8px;">Промокод</h4>
      <div style="display:flex; gap:8px;">
        <input type="text" id="promo-input" class="inp mono" placeholder="ВВЕДИТЕ ПРОМОКОД" style="text-transform:uppercase;">
        <button class="btn primary" onclick="applyPromo()">Применить</button>
      </div>
    </div>

    <div class="card-panel">
      <h4 style="font-weight:800; margin-bottom:10px;">Косметический Магазин</h4>
      
      <div class="shop-tabs">
        <button class="shop-tab ${shopSubTab === 'frames' ? 'active' : ''}" onclick="switchShopTab('frames')">Рамки (${SHOP.frames.length})</button>
        <button class="shop-tab ${shopSubTab === 'nicks' ? 'active' : ''}" onclick="switchShopTab('nicks')">Цвета ников (${SHOP.nicks.length})</button>
        <button class="shop-tab ${shopSubTab === 'prefixes' ? 'active' : ''}" onclick="switchShopTab('prefixes')">Префиксы (${SHOP.prefixes.length})</button>
      </div>

      <div class="shop-grid" id="shop-items-grid"></div>
    </div>

    <button class="btn sell full" style="margin-top:4px;" onclick="logout()">Выйти из аккаунта</button>
  `;

  renderShopItems();
}

function switchShopTab(tab) {
  sounds.play('click');
  shopSubTab = tab;
  document.querySelectorAll('.shop-tab').forEach((el, i) => {
    el.classList.toggle('active', ['frames', 'nicks', 'prefixes'][i] === tab);
  });
  renderShopItems();
}

function renderShopItems() {
  const grid = document.getElementById('shop-items-grid');
  if (!grid) return;
  const u = getUser();

  if (!u.inventory) {
    u.inventory = { frames: ['fr_base'], nicks: ['nk_base'], prefixes: ['pref_none'] };
  }

  let items = [];
  if (shopSubTab === 'frames') items = SHOP.frames;
  else if (shopSubTab === 'nicks') items = SHOP.nicks;
  else if (shopSubTab === 'prefixes') items = SHOP.prefixes;

  grid.innerHTML = items.map(item => {
    const listKey = shopSubTab === 'frames' ? 'frames' : shopSubTab === 'nicks' ? 'nicks' : 'prefixes';
    const activeKey = shopSubTab === 'frames' ? u.frame : shopSubTab === 'nicks' ? u.nickColor : u.prefix;
    const isOwned = u.inventory[listKey] && u.inventory[listKey].includes(item.id);
    const isActive = activeKey === item.id;

    let btnText = 'Купить';
    let btnClass = 'btn sm full';
    if (isActive) {
      btnText = 'Надето';
      btnClass = 'btn sm full buy';
    } else if (isOwned) {
      btnText = 'Надеть';
      btnClass = 'btn sm full primary';
    }

    return `
      <div class="shop-card">
        <div>
          <div style="font-size:12.5px; font-weight:800; margin-bottom:2px;">${item.name}</div>
          <div class="mono" style="font-size:11px; color:var(--text-muted); margin-bottom:6px;">${item.price === 0 ? 'Бесплатно' : fmtUSD(item.price)}</div>
        </div>
        <button class="${btnClass}" onclick="handleShopAction('${shopSubTab}', '${item.id}', ${item.price})">${btnText}</button>
      </div>
    `;
  }).join('');
}

function handleShopAction(category, id, price) {
  sounds.play('click');
  const u = getUser();
  const listKey = category;
  if (!u.inventory[listKey]) u.inventory[listKey] = [category === 'frames' ? 'fr_base' : category === 'nicks' ? 'nk_base' : 'pref_none'];

  const isOwned = u.inventory[listKey].includes(id);

  if (!isOwned) {
    if (u.cash < price) {
      toast('Недостаточно средств!', 'err');
      return;
    }
    u.cash -= price;
    u.inventory[listKey].push(id);
    toast('Успешно куплено!', 'ok');
  }

  if (category === 'frames') u.frame = id;
  else if (category === 'nicks') u.nickColor = id;
  else if (category === 'prefixes') u.prefix = id;

  saveDB();
  renderHeader();
  renderProfileView(document.getElementById('main-view'), u);
}

function applyPromo() {
  const code = document.getElementById('promo-input').value.trim().toUpperCase();
  const u = getUser();
  if (PROMOS[code]) {
    const p = PROMOS[code];
    if (p.cash) u.cash += p.cash;
    if (p.prefix) {
      if (!u.inventory.prefixes.includes(p.prefix)) u.inventory.prefixes.push(p.prefix);
      u.prefix = p.prefix;
    }
    toast(p.msg, 'ok');
    saveDB(); 
    renderHeader(); 
    renderProfileView(document.getElementById('main-view'), u);
  } else {
    toast('Неверный промокод!', 'err');
  }
}

function uploadAvatar(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(evt) {
    const u = getUser();
    u.customAvatar = evt.target.result;
    saveDB(); renderHeader(); renderProfileView(document.getElementById('main-view'), u);
    toast('Аватар обновлен!', 'ok');
  };
  reader.readAsDataURL(file);
}

function logout() {
  DB.session = null;
  saveDB();
  document.getElementById('app-screen').classList.add('hidden');
  document.getElementById('auth-screen').classList.remove('hidden');
}

/* App Entry Point */
if (DB.session && DB.users[DB.session]) {
  startApp();
} else {
  setAuthTab('login');
}
</script>
</body>
</html>
